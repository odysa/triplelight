[package]
name = "triplelight-c"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "triplelight_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rayon = { version = "=1.12.0", optional = true }
triplelight = { path = "../.." }
arrow-array = { version = "60.1", default-features = false, features = ["ffi"] }
arrow-schema = { version = "60.1", default-features = false }

# Built on its own (own toolchain and lockfile), not as a member of the root workspace.
[workspace]

[features]
default = ["rdfs", "shacl"]
rdfs = ["triplelight/rdfs"]
shacl = ["triplelight/shacl"]
# Benchmark instrumentation, off by default.
benchmark-rayon-witness = ["dep:rayon"]
# RDF 1.2 terms (triple terms, base direction) in results, forwarded to the engine. Off by default.
rdf-12 = ["triplelight/rdf-12"]
