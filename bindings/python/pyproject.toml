[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rdfdb"
version = "0.1.0"
description = "Embedded persistent RDF database with SPARQL (Rust core)"
requires-python = ">=3.9"

[project.optional-dependencies]
arrow = ["pyarrow>=15"]

[tool.maturin]
python-source = "python"
module-name = "rdfdb._rdfdb"
