[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "triplelight"
version = "0.1.0"
description = "Embedded persistent RDF database with SPARQL (Rust core)"
requires-python = ">=3.9"
license-files = ["notices/THIRD_PARTY_NOTICES.md"]

[tool.maturin]
python-source = "python"
module-name = "triplelight._triplelight"
