[package]
name = "triplelight-python"
version = "0.1.0"
edition = "2024"

[lib]
name = "_triplelight"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
triplelight = { path = "../.." }

# Built on its own (own toolchain and lockfile), not as a member of the root workspace.
[workspace]
