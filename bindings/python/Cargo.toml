[package]
name = "triplelight-python"
version = "0.1.0"
license = "MIT"
edition = "2024"

[lib]
name = "_triplelight"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
triplelight = { path = "../..", default-features = false }

# Built on its own (own toolchain and lockfile), not as a member of the root workspace.
[workspace]

[features]
default = ["rdfs", "shacl"]
rdfs = ["triplelight/rdfs"]
shacl = ["triplelight/shacl"]
# SPARQL 1.2 / RDF 1.2 terms (triple terms, base direction), forwarded to the engine. Off by default.
rdf-12 = ["triplelight/rdf-12"]
