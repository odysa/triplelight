[package]
name = "rdfdb-python"
version = "0.1.0"
edition = "2024"

[lib]
name = "_rdfdb"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24.1", features = ["extension-module", "abi3-py39"] }
rdfdb = { path = "../.." }
oxrdf = "0.3.5"

arrow-array = "55.2.0"
arrow-schema = "55.2.0"
arrow-pyarrow = "55.2.0"
