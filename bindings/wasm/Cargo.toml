[package]
name = "triplelight-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
triplelight = { path = "../.." }
wasm-bindgen = "=0.2.100"
js-sys = "0.3.77"
# Randomness for blank-node labels and UUID() comes from the JS host (crypto.getRandomValues).
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true

# Built on its own (own toolchain and lockfile), not as a member of the root workspace.
[workspace]
