<text x="16" y="336" font-size="11.5" fill="#c3c2b7">Time is end-to-end HTTP, summed over the scored requests of one pass. Memory includes page cache and kernel memory, not process RSS.</text>
<text x="16" y="354" font-size="11.5" fill="#c3c2b7">* DuckDB has no SPARQL: a translator for this suite's COUNT queries turns each into SQL over one triples table, inside the timed request.</text>
