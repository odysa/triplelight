<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="960" height="320" fill="#fcfcfb"/>
<text x="16" y="28" font-size="17" font-weight="600" fill="#0b0b0b">BSBM Business Intelligence, 98.9M triples</text>
<text x="16" y="48" font-size="12.5" fill="#52514e">45 scored requests per pass, 4 CPUs and 12 GiB per engine, same VM and session. Lower is better in both panels.</text>
