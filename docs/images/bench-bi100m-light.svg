SQL baseline*, pass 2: 443.5 s</title></circle>
<text x="456" y="233.5" font-size="12" fill="#0b0b0b">443.5 s</text>
<rect x="572" y="224" width="297.9" height="11" rx="3" fill="#eb6834"><title>DuckDB 2.0
SQL baseline*, pass 2: 12.0 GiB</title></rect>
<text x="875.9" y="233.5" font-size="12" fill="#0b0b0b">12.0 GiB</text>
<text x="16" y="290" font-size="11.5" fill="#52514e">Time is end-to-end HTTP, summed over the scored requests of one pass. Memory includes page cache and kernel memory, not process RSS.</text>
<text x="16" y="308" font-size="11.5" fill="#52514e">* DuckDB has no SPARQL: each request fills a hand-written SQL template over one triples table (generation time included).</text>
</svg>
