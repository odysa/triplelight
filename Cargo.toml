[workspace]
members = [".", "crates/*"]
# The language bindings (bindings/*) build as separate packages with their own toolchains and lockfiles; each
# declares its own empty [workspace].
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/odysa/triplelight"
homepage = "https://github.com/odysa/triplelight"
keywords = ["rdf", "sparql", "database", "embedded", "triplestore"]
categories = ["database-implementations"]

# Clippy runs with -D warnings in CI. These lints flag deliberate design choices here (dense generic iterator types,
# executor entry points with many inputs, enums whose variants differ in size by design); everything else is enforced.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"

[workspace.dependencies]
triplelight-core = { path = "crates/triplelight-core", version = "0.1.0" }
triplelight-iri = { path = "crates/triplelight-iri", version = "0.1.0" }
triplelight-rdf = { path = "crates/triplelight-rdf", version = "0.1.0" }
triplelight-storage = { path = "crates/triplelight-storage", version = "0.1.0" }
triplelight-sparql = { path = "crates/triplelight-sparql", version = "0.1.0" }
triplelight-plan = { path = "crates/triplelight-plan", version = "0.1.0" }
triplelight-exec = { path = "crates/triplelight-exec", version = "0.1.0" }
oxrdf = "0.3.5"
oxttl = "0.2.5"
oxiri = "0.2.11"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1.12.0"
hashbrown = { version = "0.17", default-features = false }
regex = "1.13.1"
sha2 = "0.10"
sha1 = "0.10"
md5 = { package = "md-5", version = "0.10" }
web-time = "1"
getrandom = "0.3"

[package]
name = "triplelight"
description = "An embedded RDF database for analytical SPARQL queries"
readme = "README.md"
# Only the library and CLI sources ship; benchmarks, evidence reports and bindings stay in the repository.
include = ["src/**", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
autobins = false
default-run = "triplelight"

[[bin]]
name = "triplelight"
path = "src/bin/triplelight.rs"

[lints]
workspace = true

[features]
# The SPARQL HTTP server (`triplelight serve` / `serve-store`). Off by default: TripleLight is embedded first.
server = ["dep:tiny_http"]
# The async embedded API (`triplelight::async_embedded`, task #41): runtime-independent, through AsyncBand.
async = ["dep:asyncband"]

[dependencies]
triplelight-core.workspace = true
triplelight-storage.workspace = true
triplelight-sparql.workspace = true
triplelight-plan.workspace = true
triplelight-exec.workspace = true
triplelight-rdf.workspace = true
sha2.workspace = true
tiny_http = { version = "0.12.0", optional = true }
asyncband = { version = "0.8", optional = true, features = ["oneshot", "semaphore"] }

[dev-dependencies]
sha2.workspace = true
rayon.workspace = true

# glibc malloc costs ~20-25% on Linux (BSBM/LUBM in the VM); on macOS the system allocator is as fast, so Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
