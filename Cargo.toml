[workspace]
members = [".", "crates/*"]
# A patched tiny-http for the server's connection timeouts (#123); see `vendor/tiny_http` and [patch.crates-io].
exclude = ["vendor/tiny_http"]
# The language bindings (bindings/*) build as separate packages with their own toolchains and lockfiles; each
# declares its own empty [workspace].
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/odysa/triplelight"
homepage = "https://github.com/odysa/triplelight"
keywords = ["rdf", "sparql", "database", "embedded", "triplestore"]
categories = ["database-implementations"]

# Clippy runs with -D warnings in CI. These lints flag deliberate design choices here (dense generic iterator types,
# executor entry points with many inputs, enums whose variants differ in size by design); everything else is enforced.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"

[workspace.dependencies]
triplelight-core = { path = "crates/triplelight-core", version = "0.1.0" }
triplelight-iri = { path = "crates/triplelight-iri", version = "0.1.0" }
triplelight-rdf = { path = "crates/triplelight-rdf", version = "0.1.0" }
triplelight-storage = { path = "crates/triplelight-storage", version = "0.1.0" }
triplelight-sparql = { path = "crates/triplelight-sparql", version = "0.1.0" }
triplelight-plan = { path = "crates/triplelight-plan", version = "0.1.0" }
triplelight-exec = { path = "crates/triplelight-exec", version = "0.1.0" }
triplelight-rdfs = { path = "crates/triplelight-rdfs", version = "0.1.0" }
triplelight-shacl = { path = "crates/triplelight-shacl", version = "0.1.0" }
oxrdf = "0.3.5"
oxttl = "0.2.5"
oxiri = "0.2.11"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1.12.0"
foldhash = "0.2.0"
hashbrown = { version = "0.17", default-features = false }
regex = "1.13.1"
sha2 = "0.11"
sha1 = "0.11"
md5 = { package = "md-5", version = "0.11" }
web-time = "1"
getrandom = "0.3"

[package]
name = "triplelight"
description = "An embedded RDF database for analytical SPARQL queries"
readme = "README.md"
# Only the library and CLI sources ship; benchmarks, evidence reports and bindings stay in the repository.
include = ["src/**", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
autobins = false
default-run = "triplelight"

[[bin]]
name = "triplelight"
path = "src/bin/triplelight.rs"

[lints]
workspace = true

[features]
default = ["rdfs", "shacl", "shell-editing"]
shell-editing = ["dep:rustyline"]
# Query-time RDFS inference.
rdfs = ["dep:triplelight-rdfs", "triplelight-exec/rdfs"]
# SHACL Core validation of RDF documents.
shacl = ["dep:triplelight-shacl"]
# The SPARQL HTTP server (`triplelight serve` / `serve-store`). Off by default: TripleLight is embedded first.
server = ["dep:tiny_http"]
# The async embedded API (`triplelight::async_embedded`, task #41): runtime-independent, through AsyncBand.
async = ["dep:asyncband"]
# RDF 1.2 terms (triple terms, directional literals) through the parsers, the stores and the results formats and
# bindings (#101, #102, #104). Off by default until all four 1.2 tasks are in.
rdf-12 = ["triplelight-rdf/rdf-12", "triplelight-core/rdf-12", "triplelight-storage/rdf-12", "triplelight-exec/rdf-12", "triplelight-sparql/sparql-12", "triplelight-shacl?/rdf-12"]
# SPARQL 1.2 queries and updates (#103) come with `rdf-12` (RDF 1.2 terms need SPARQL 1.2 handling everywhere a term
# is matched); `sparql-12` is an alias.
sparql-12 = ["rdf-12"]

[dependencies]
triplelight-core.workspace = true
triplelight-storage.workspace = true
triplelight-sparql.workspace = true
triplelight-plan.workspace = true
triplelight-exec.workspace = true
triplelight-rdf.workspace = true
sha2.workspace = true
triplelight-rdfs = { workspace = true, optional = true }
triplelight-shacl = { workspace = true, optional = true }
tiny_http = { version = "0.12.0", optional = true }
asyncband = { version = "0.8", optional = true, features = ["oneshot", "semaphore"] }

[dev-dependencies]
sha2.workspace = true
rayon.workspace = true

[target.'cfg(unix)'.dependencies]
rustyline = { version = "18.0.1", default-features = false, optional = true }
unicode-width = "0.2"

# The CLI uses the same allocator on Linux and macOS.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

# tiny-http 0.12.0 with per-connection read/write timeouts and non-fatal accept errors (#123). The diff against
# upstream is in the PR that added it; the MIT/Apache licence texts are in THIRD_PARTY_NOTICES.md.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
