[package]
name = "triplelight-sparql"
description = "TripleLight's SPARQL 1.1 parser and algebra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# SPARQL 1.2 query syntax (W3C SPARQL 1.2 Query Language, Working Draft 2026-11-19): triple terms `<<( … )>>`, reified
# triples `<< … >>`, reifiers `~`, annotations `{| … |}`, `@lang--dir` literals, `VERSION`, and the triple-term and
# base-direction functions. Needs RDF 1.2 terms, so it enables `triplelight-core/rdf-12` (→ `triplelight-rdf/rdf-12`).
sparql-12 = ["triplelight-core/rdf-12"]

[dependencies]
triplelight-core.workspace = true
triplelight-iri.workspace = true

[lints]
workspace = true
