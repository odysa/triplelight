[package]
name = "triplelight-core"
description = "Shared types and storage traits of TripleLight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# RDF 1.2: triple terms, directional literals and `BaseDirection` in the re-exported `rdf` module, the line
# parsers (#102) and `Dictionary::triple_term_parts` (#101). Forwards triplelight-rdf's feature of the same name.
rdf-12 = ["triplelight-rdf/rdf-12"]

[dependencies]
triplelight-rdf.workspace = true
triplelight-iri.workspace = true
# Exact versions keep all analyzer tables on Unicode 17.0.0.
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
# Comparators only (task #45): the differential tests check `ntriples` and `turtle` against oxttl, whose oxrdf
# terms they convert to TripleLight's.
oxttl.workspace = true
oxrdf.workspace = true

[lints]
workspace = true
