[package]
name = "triplelight-exec"
description = "TripleLight SPARQL evaluator over term IDs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Query-time RDFS graph views.
rdfs = []
# SPARQL 1.2 evaluation (W3C SPARQL 1.2 Query Language, Working Draft 2026-11-19): triple-term patterns in BGPs and
# paths, VALUES / DATA / templates with triple terms, the triple-term and base-direction functions, and ORDER BY /
# equality over triple terms and directional literals. Needs the SPARQL 1.2 algebra and RDF 1.2 terms.
sparql-12 = ["rdf-12"]
# RDF 1.2 terms everywhere in the executor: results (#104) and SPARQL 1.2 evaluation (#103) are one feature, since
# RDF 1.2 terms make every `Term` match need its triple-term arm. `sparql-12` is an alias.
rdf-12 = ["triplelight-rdf/rdf-12", "triplelight-core/rdf-12", "triplelight-sparql/sparql-12"]

[dependencies]
triplelight-core.workspace = true
triplelight-plan.workspace = true
triplelight-sparql.workspace = true
triplelight-rdf.workspace = true
triplelight-iri.workspace = true
rust_decimal.workspace = true
num-bigint.workspace = true
rayon.workspace = true
regex.workspace = true
sha2.workspace = true
sha1.workspace = true
md5.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

[lints]
workspace = true
