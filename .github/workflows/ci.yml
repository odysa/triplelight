name: CI

# Light per-push check: one Linux job. The full matrix is `ci-full.yml` (nightly and on demand).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "bench/results/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "bench/results/**", "**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features server,async -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --features server,async
      - name: Third-party notices and evidence paths
        run: |
          python3 ci/check_notices.py
          python3 ci/check_paths.py
