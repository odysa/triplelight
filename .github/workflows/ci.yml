name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Build with the HTTP server feature
        run: cargo build --locked --features server
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features server,async,rdfs,shacl -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --features server,async,rdfs,shacl
      - name: Check the optional features independently
        run: |
          cargo test --locked --test query --test cli requires_the_feature
          cargo check --locked --features rdfs
          cargo check --locked --features shacl
      - name: Third-party notices are in sync with the binding packages
        run: python3 ci/check_notices.py
      - name: No absolute local paths in the evidence files
        run: python3 ci/check_paths.py
      - name: Code structure (deslop-please, AGENTS.md)
        run: |
          rustup component add rust-analyzer
          cargo install --locked deslop-please --version 0.1.3
          ci/deslop.sh
      - name: RDF 1.2 (feature rdf-12) across the workspace, plus the term-type differential
        run: |
          cargo clippy --locked --workspace --all-targets --features server,async,rdf-12,rdfs,shacl -- -D warnings
          cargo test --locked --workspace --features server,async,rdf-12,rdfs,shacl
          cargo clippy --locked -p triplelight-rdf --all-targets --features rdf-12 -- -D warnings
          cargo test --locked -p triplelight-rdf --features rdf-12
          cd conformance/rdf12-diff && cargo test --locked --release

  w3c:
    name: W3C SPARQL 1.1 query suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build CLI with RDFS entailment
        run: cargo build --locked --release --features rdfs
      - name: Fetch pinned w3c/rdf-tests
        run: |
          git init -q rdf-tests
          git -C rdf-tests fetch -q --depth 1 https://github.com/w3c/rdf-tests.git 56076c0efec4c353efcae2971be8f6005294ac64
          git -C rdf-tests checkout -q FETCH_HEAD
      - name: Run suite
        run: |
          pip install -q rdflib==7.1.4
          python bench/w3c_sparql11.py rdf-tests/sparql/sparql11 target/release/triplelight w3c.json
      - name: Check against the floor
        run: python ci/w3c_floor.py w3c.json ci/w3c_floor.json
      - name: RDFS entailment cases (listed expected differences only shrink)
        run: python bench/w3c_rdfs_entailment.py rdf-tests/sparql/sparql11 target/release/triplelight w3c-rdfs.json bench/w3c_rdfs_expected_differences.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3c-results
          path: |
            w3c.json
            w3c-rdfs.json

  w3c12:
    name: W3C RDF and SPARQL 1.2 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: conformance/rdf12-diff
      - name: Fetch pinned W3C 1.2 fixtures
        run: |
          git init -q rdf-tests-12
          git -C rdf-tests-12 remote add origin https://github.com/w3c/rdf-tests.git
          git -C rdf-tests-12 sparse-checkout set rdf/rdf12 sparql/sparql12
          git -C rdf-tests-12 fetch -q --depth 1 --filter=blob:none origin 56076c0efec4c353efcae2971be8f6005294ac64
          git -C rdf-tests-12 checkout -q --detach FETCH_HEAD
      - name: Run the 1.2 suites and check the floors
        working-directory: conformance/rdf12-diff
        shell: bash
        env:
          TL_RDF_TESTS: ${{ github.workspace }}/rdf-tests-12
          CARGO_TERM_COLOR: never
        run: cargo test --locked --release --no-fail-fast -- --include-ignored --nocapture --test-threads=1 2>&1 | tee ../../w3c12.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3c12-results
          path: w3c12.log

  shacl:
    name: W3C SHACL Core conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the pinned suite, run it and check the summary
        run: ci/shacl-core.sh

  python:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test
        working-directory: bindings/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -q "maturin>=1.7,<2" pytest
          maturin develop --release --locked
          pytest -q tests
          cargo check --locked --no-default-features
      - name: Notices ship in the wheel and sdist
        working-directory: bindings/python
        run: |
          . .venv/bin/activate
          maturin build --release --locked -o dist
          maturin sdist -o dist
          python ../../ci/check_notices.py --artifacts dist

  node:
    name: Node.js binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and test
        working-directory: bindings/node
        run: |
          cargo build --release --locked
          node scripts/copy-native.js release
          npm test
          cargo check --locked --no-default-features
      - name: Notices ship in the npm package
        working-directory: bindings/node
        run: |
          mkdir -p dist && npm pack --ignore-scripts --pack-destination dist
          python3 ../../ci/check_notices.py --artifacts dist

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from bindings/wasm/rust-toolchain.toml)
        working-directory: bindings/wasm
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version 0.2.100
      - name: Build and test
        working-directory: bindings/wasm
        run: |
          cargo build --release --locked --target wasm32-unknown-unknown
          node scripts/bindgen.js
          npm test
          test -f pkg/THIRD_PARTY_NOTICES.md && test -f pkg-node/THIRD_PARTY_NOTICES.md && test -f pkg/LICENSE && test -f pkg-node/LICENSE
          cargo check --locked --no-default-features --target wasm32-unknown-unknown

  c-go-java:
    name: C ABI, Go and Java 25 bindings (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from bindings/c/rust-toolchain.toml)
        working-directory: bindings/c
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/c
      - name: C ABI build and test
        working-directory: bindings/c
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --release
          cargo build --locked --release
          cargo check --locked --no-default-features
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Go binding
        working-directory: bindings/go
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Go Arrow C Stream import (arrow-go, separate module)
        working-directory: bindings/go/arrowtest
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Java binding
        working-directory: bindings/java
        run: |
          mvn -B test
          mvn -B -DskipTests package
          unzip -l target/triplelight-0.1.0.jar | grep -q META-INF/THIRD_PARTY_NOTICES.md && unzip -l target/triplelight-0.1.0.jar | grep -q META-INF/LICENSE
